[package]
name = "openplush-pattern"
description = "Pattern pieces: allowance, notches, labels, grain, piece dedupe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Exact pin: the version research/i_overlay_fuzz audited; re-run it before bumping.
i_overlay = { version = "=9.0.1", default-features = false }
openplush-geom = { path = "../openplush-geom" }
openplush-mesh = { path = "../openplush-mesh" }
openplush-seams = { path = "../openplush-seams" }
thiserror = "2.0.21"

[dev-dependencies]
# The `research/i_overlay_fuzz/` corpus generator's trigonometry, identical on every target; the version i_float pulls in.
libm = "=0.2.16"
# That corpus's oracle's exact orientation, independent of the engine; the version openplush-geom uses.
robust = "=1.2.0"

[lints]
workspace = true

# Only the wasm32 test build needs the harness; native tests use plain #[test].
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
