[package]
name = "openplush-export"
description = "SVG and PDF writers, to bytes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
openplush-geom = { path = "../openplush-geom" }
openplush-layout = { path = "../openplush-layout" }
openplush-pattern = { path = "../openplush-pattern" }
# Exact pin: the version research/s5_svg2pdf_wasm measured; re-run it before bumping.
pdf-writer = "=0.15.0"
thiserror = "2.0.21"

[lints]
workspace = true

# Only the wasm32 test build needs the harness; native tests use plain #[test].
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
