# T015: web shell gates. Steps that need a package no-op until it exists
# (root scripts use --if-present), so CI passes on the empty workspace.
# Drop --if-present from package.json in the PR that adds the first package:
# after that, a package without a typecheck/test script should fail, not pass.
name: shell

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only; every push to main gets its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell:
    name: typecheck, unit, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: playwright
        if: hashFiles('apps/web/package.json') != ''
        run: |
          pnpm --filter web --fail-if-no-match exec playwright install --with-deps chromium
          pnpm --filter web --fail-if-no-match exec playwright test
