# T013: engine gates. Runs on every PR, including PRs stacked on another branch.
name: engine

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs exactly what rust-toolchain.toml pins (toolchain = MSRV).
      - run: rustup toolchain install
      # T016, Constitution I. Needs only cargo metadata (seconds), so it runs before
      # the build: a failing test must not hide a boundary violation. The self-test
      # runs first so a broken checker cannot pass everything.
      - name: boundary check self-test
        run: scripts/tests/check-boundary.test.sh
      - name: boundary check
        run: scripts/check-boundary.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
