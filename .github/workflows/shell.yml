# Web shell gates. `pnpm -r <script>` skips a package that lacks the script, with or
# without --if-present, so a package without typecheck or test passes unchecked:
# each package defines both, and review keeps it so.
name: shell

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only; every push to main gets its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell:
    name: typecheck, unit, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # The same entry point contributors run: install, typecheck, unit
      # tests, and Playwright once apps/web exists.
      - run: scripts/check.sh shell
