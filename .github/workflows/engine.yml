# T013: engine gates. Runs on every PR, including PRs stacked on another branch.
name: engine

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only. On main, every merge of a stack needs its own
  # green run, so pushes there must not cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs exactly what rust-toolchain.toml pins (toolchain = MSRV).
      - run: rustup toolchain install
      # T016, Constitution I. Needs only cargo metadata (seconds), so it runs before
      # the build: a failing test must not hide a boundary violation. The self-test
      # runs first so a broken checker cannot pass everything.
      - name: boundary check self-test
        run: scripts/tests/check-boundary.test.sh
      - name: boundary check
        run: scripts/check-boundary.sh
      # T172: the compiler-resolved layer (crates/clippy.toml) rejects what the text
      # scan cannot see; the clippy step below enforces it on the real crates.
      - name: clippy boundary layer self-test
        run: scripts/tests/clippy-boundary.test.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny calls cargo metadata, so it needs the pinned toolchain too.
      - run: rustup toolchain install
      # The same cargo-deny version contributors run locally, as a checksummed release
      # binary, rather than whatever a Docker action bundles.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny check
