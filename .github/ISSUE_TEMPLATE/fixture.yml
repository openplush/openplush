name: Contribute a test model
description: Offer a 3D model for the fixture corpus. No code needed.
labels: ["lane:fixtures"]
body:
  - type: markdown
    attributes:
      value: |
        Test models are the most useful contribution right now (CONTRIBUTING.md). A model that comes with a **known-good hand-made sewing pattern** is worth the most: it becomes a regression oracle, and it's the only way to check that seam hints land where experienced makers actually cut.
  - type: input
    id: source
    attributes:
      label: Where is the model from?
      description: A link, or "I made it".
    validations:
      required: true
  - type: dropdown
    id: license
    attributes:
      label: License
      description: Only these can ship in the repository (plan.md, fixture corpus; each model gets an entry in fixtures/meshes/LICENSES.md).
      options:
        - CC0
        - CC-BY (I'll give the attribution text below)
        - I made it and release it as CC0
    validations:
      required: true
  - type: input
    id: attribution
    attributes:
      label: Attribution text (CC-BY only)
  - type: dropdown
    id: pattern
    attributes:
      label: Is there a hand-made pattern for it?
      options:
        - "Yes, and I can share the pattern pieces"
        - "Yes, but I can only describe where the seams go"
        - "No"
    validations:
      required: true
  - type: dropdown
    id: pattern-license
    attributes:
      label: Pattern license (if you're sharing pattern pieces)
      description: A shared pattern becomes a test oracle in the repository, so it needs a license too.
      options:
        - Not sharing a pattern
        - CC0
        - CC-BY (attribution text below)
        - I made it and release it as CC0
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of test is it?
      options:
        - A normal plush shape
        - A defect example (non-manifold, holes, flipped faces, unwelded glTF, ...)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Format (OBJ, glTF, STL, PLY), size, what makes it interesting.
