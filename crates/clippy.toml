# Engine lane. Clippy reads only the nearest clippy.toml, so this file
# repeats every rule in the root clippy.toml, then adds the boundary bans.
# scripts/tests/clippy-boundary.test.sh checks both halves.
#
# Constitution I / AGENTS.md: crates/ never touches the filesystem, clock, threads,
# network, or processes. scripts/check-boundary.sh catches those textually; the
# items listed here are resolved by the compiler, so aliases (use std::time;) and
# renamed std (use std as s;) cannot hide *these items*. Clippy cannot ban a whole
# module, so coverage is exactly this list: scripts/tests/clippy-boundary.test.sh
# is the authoritative record of what is caught. openplush-testkit has its own clippy.toml
# without the filesystem bans: loading fixtures is its job.

disallowed-types = [
    # From the root clippy.toml (determinism, Constitution V).
    { path = "std::collections::HashMap", reason = "iteration order is not deterministic; use BTreeMap or an index-ordered Vec" },
    { path = "std::collections::HashSet", reason = "iteration order is not deterministic; use BTreeSet or an index-ordered Vec" },
    # Boundary (Constitution I).
    { path = "std::fs::File", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::OpenOptions", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::DirBuilder", reason = "engine crates never touch the filesystem" },
    { path = "std::time::Instant", reason = "engine crates never read the clock (determinism; unavailable on wasm32)" },
    { path = "std::time::SystemTime", reason = "engine crates never read the clock (determinism; unavailable on wasm32)" },
    { path = "std::thread::Builder", reason = "engine crates never spawn threads (single-threaded WASM)" },
    { path = "std::net::TcpStream", reason = "engine crates never use the network (privacy)" },
    { path = "std::net::TcpListener", reason = "engine crates never use the network (privacy)" },
    { path = "std::net::UdpSocket", reason = "engine crates never use the network (privacy)" },
    { path = "std::process::Command", reason = "engine crates never spawn processes" },
]

disallowed-methods = [
    # From the root clippy.toml (determinism, Constitution V).
    { path = "slice::sort_unstable", reason = "equal elements end in an unspecified order; use sort, with a total order" },
    { path = "slice::sort_unstable_by", reason = "equal elements end in an unspecified order; use sort_by, with a total order" },
    { path = "slice::sort_unstable_by_key", reason = "equal elements end in an unspecified order; use sort_by_key" },
    { path = "slice::select_nth_unstable", reason = "equal elements end in an unspecified order; sort stably, then index" },
    { path = "slice::select_nth_unstable_by", reason = "equal elements end in an unspecified order; sort stably, then index" },
    { path = "slice::select_nth_unstable_by_key", reason = "equal elements end in an unspecified order; sort stably, then index" },
    # Boundary (Constitution I).
    { path = "std::fs::read", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::read_to_string", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::read_dir", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::write", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::copy", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::rename", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::create_dir", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::create_dir_all", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::remove_file", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::remove_dir", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::remove_dir_all", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::metadata", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::canonicalize", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::exists", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::read_link", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::symlink_metadata", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::hard_link", reason = "engine crates never touch the filesystem" },
    { path = "std::fs::set_permissions", reason = "engine crates never touch the filesystem" },
    # The filesystem through std::path, without any std::fs path written out.
    { path = "std::path::Path::exists", reason = "engine crates never touch the filesystem" },
    { path = "std::path::Path::try_exists", reason = "engine crates never touch the filesystem" },
    { path = "std::path::Path::is_file", reason = "engine crates never touch the filesystem" },
    { path = "std::path::Path::is_dir", reason = "engine crates never touch the filesystem" },
    { path = "std::path::Path::is_symlink", reason = "engine crates never touch the filesystem" },
    { path = "std::path::Path::metadata", reason = "engine crates never touch the filesystem" },
    { path = "std::path::Path::symlink_metadata", reason = "engine crates never touch the filesystem" },
    { path = "std::path::Path::read_dir", reason = "engine crates never touch the filesystem" },
    { path = "std::path::Path::read_link", reason = "engine crates never touch the filesystem" },
    { path = "std::path::Path::canonicalize", reason = "engine crates never touch the filesystem" },
    # The clock without naming SystemTime: UNIX_EPOCH.elapsed().
    { path = "std::time::SystemTime::elapsed", reason = "engine crates never read the clock (determinism; unavailable on wasm32)" },
    # OS randomness: a randomly seeded hasher makes iteration order vary per run.
    { path = "std::hash::RandomState::new", reason = "OS randomness breaks determinism (Constitution V)" },
    # DNS resolution is network access.
    { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "engine crates never use the network (privacy)" },
    { path = "std::thread::spawn", reason = "engine crates never spawn threads (single-threaded WASM)" },
    { path = "std::thread::scope", reason = "engine crates never spawn threads (single-threaded WASM)" },
    { path = "std::thread::sleep", reason = "engine crates never block on the clock" },
    { path = "std::process::exit", reason = "engine crates never end the process; return a typed error" },
    { path = "std::process::abort", reason = "engine crates never end the process; return a typed error" },
]


# Small units (AGENTS.md, Engineering rules); too_many_lines is enabled in Cargo.toml.
too-many-lines-threshold = 60
too-many-arguments-threshold = 5

# Tests may unwrap, expect, and panic: a failed test is the panic's purpose, and the
# no-panic rule is about user-derived data at runtime. Library code is unaffected.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
