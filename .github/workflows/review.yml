# Automated adversarial review on every pull request, by the agents in
# .claude/agents/ (pr-reviewer always; spec-reviewer when specs change;
# mutation-auditor when engine code changes). Advisory, not a gate: it posts
# findings as review comments and never approves. The maintainer still merges.
#
# Needs one repository secret: ANTHROPIC_API_KEY, or CLAUDE_CODE_OAUTH_TOKEN
# (from `claude setup-token`). Without either, the job skips with a notice.
# PR content (the diff and the files the agents read) is sent to the Anthropic
# API. That is CI tooling, not product runtime: the app itself still makes no
# network calls (Constitution, privacy).
name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push supersedes the review of the previous one.
  cancel-in-progress: true

jobs:
  review:
    name: adversarial review
    # Same-repo, non-draft PRs only: fork PRs get no secrets, and drafts are
    # not ready to review.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_CREDENTIAL: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: skip without a credential
        if: env.HAS_CREDENTIAL != 'true'
        run: echo "::notice::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret; automated review skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CREDENTIAL == 'true'
        with:
          # Full history, so the agents can diff against the PR's base branch.
          fetch-depth: 0
          persist-credentials: false
      # The agents run cargo (probes, mutation testing), so they need the pinned
      # toolchain and a warm cache.
      - if: env.HAS_CREDENTIAL == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.HAS_CREDENTIAL == 'true'
      - uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        if: env.HAS_CREDENTIAL == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job's own token: scoped to the permissions above, expires with
          # the job. Comments appear as github-actions[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            You coordinate an adversarial review of this pull request using the
            project's agents in .claude/agents/. Diff against the base branch
            above (stacked PRs target their parent, not main):
            `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`.

            1. List the changed paths. Run these agents, in parallel where you can,
               each told the PR number, base branch, and head SHA:
               - pr-reviewer: always.
               - spec-reviewer: if anything under specs/ or .specify/memory/ changed.
               - mutation-auditor: if any .rs file under crates/ changed.
               Tell them this is CI: skip `scripts/check.sh wasm` (the wasm workflow
               covers it) and leave the working tree exactly as they found it.
            2. Merge their findings. Drop duplicates and anything without evidence.
               Keep the severity marks: 🔴 blocking, 🟡 nit (optional), 🟣 pre-existing.
            3. Post each finding that points at a line of the diff as an inline
               comment with mcp__github_inline_comment__create_inline_comment and
               confirmed: true. Start each with its severity mark; end each with:

               ---
               _Generated by [Claude Code](https://claude.ai/code)_

            4. Post one summary with `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`:
               which agents ran, the count of 🔴/🟡/🟣 findings, the mutation kill
               count if the auditor ran, findings that do not map to a diff line, and
               "Nothing blocking" if that is true. End it with the same footer.

            Never approve, request changes, push, or edit files yourself. Verified
            findings only: a wrong finding costs the author more than a missed one.
          claude_args: >-
            --allowedTools "Task,Agent,Read,Grep,Glob,Edit,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(cargo:*),Bash(scripts/check.sh:*),Bash(cp:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
