[package]
name = "openplush-seams"
description = "SeamSet, cut-graph completion, darts, symmetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
openplush-geom = { path = "../openplush-geom" }
openplush-mesh = { path = "../openplush-mesh" }
libm = "0.2.16"
thiserror = "2.0.21"

# Native only: proptest pulls in getrandom, which does not build for
# wasm32-unknown-unknown without a JS backend.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
