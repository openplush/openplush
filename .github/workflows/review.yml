# Automated adversarial review, by the agents in .claude/agents/
# (pr-reviewer always; spec-reviewer when specs change; docs-reviewer when a public
# surface, docs/, a tasks.md, the README or CONTRIBUTING changes, since each can
# state what is built; mutation-auditor only on request). Advisory: it posts
# findings as review comments and never approves. The maintainer merges.
#
# Runs ONCE per PR, to spare the subscription's usage limits: when the PR is
# opened (or marked ready for review), not on every push. Only the maintainer
# asks for another run (ADR 0013): add the `rereview` label, or `mutation-audit`
# alone for a rerun that also runs the mutation auditor. When both labels are on
# the PR as one event sees them (added in one operation), only the
# `mutation-audit` event runs; added one after the other, both can run. The
# labels are removed when the run starts, so they can be added again later.
# Not reviewed on opening: a PR titled `docs(tasks): tick …`
# (checkbox ticks only), a PR from a `chore/` branch, and a docs-only PR (every
# changed path under docs/). `rereview` still runs any of them.
# A rerun reviews only what changed since the last summary's head, and drops
# findings the author already answered, so it does not repeat the first run.
#
# A green check means a review summary was posted, not merely that the agent
# ran: a run that adds no summary for the PR's head commit fails. Its transcript
# is kept as an artifact for a week so the reason can be read; it holds the diff
# and the files the agents read, so anyone with read access can download it.
#
# Authenticates with CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`), which
# draws on the maintainer's Claude subscription. There is deliberately no API-key
# fallback, so this workflow can never bill API usage. Without the secret, the
# job skips with a notice.
# PR content (the diff and the files the agents read) is sent to the Anthropic
# API. That is CI tooling, not product runtime: the app itself still makes no
# network calls (Constitution, privacy).
name: review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A review run is never cancelled part-way (that would waste the usage spent);
  # a second request waits for the first to finish.
  cancel-in-progress: false

jobs:
  # Whether every changed path is under docs/. The event carries no file list.
  scope:
    name: changed paths
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Two steps, so a failed listing fails the job instead of counting as docs-only.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          others=$(grep -cv '^docs/' <<<"$files" || true)
          echo "docs_only=$([[ $others == 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  review:
    name: adversarial review
    needs: scope
    # Same-repo, non-draft PRs only (fork PRs get no secrets; drafts are not
    # ready). A `labeled` event runs only for the two review labels, and a
    # `rereview` event yields to `mutation-audit` when both are on the PR; a tick,
    # chore or docs-only PR runs only on a label. `!cancelled()` runs it after a
    # skipped scope (a label event) and after a failed one, so a scope error
    # reviews rather than skips.
    if: >-
      github.event.pull_request.draft == false &&
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' ||
       (github.event.label.name == 'rereview' &&
        !contains(github.event.pull_request.labels.*.name, 'mutation-audit')) ||
       github.event.label.name == 'mutation-audit') &&
      (github.event.action == 'labeled' ||
       (!startsWith(github.event.pull_request.title, 'docs(tasks): tick') &&
        !startsWith(github.event.pull_request.head.ref, 'chore/') &&
        needs.scope.outputs.docs_only != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_CREDENTIAL: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      MUTATION_AUDIT: ${{ contains(github.event.pull_request.labels.*.name, 'mutation-audit') }}
      # The summary's first line; the job counts comments starting with it.
      SUMMARY_HEAD: '**Review summary (PR ${{ github.event.pull_request.number }}, head ${{ github.event.pull_request.head.sha }})**'
    steps:
      - name: skip without a credential
        if: env.HAS_CREDENTIAL != 'true'
        run: echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN secret; automated review skipped."
      # Clear the request labels first, so they can be added again to ask for
      # another run.
      - name: clear review labels
        if: env.HAS_CREDENTIAL == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label rereview --remove-label mutation-audit || true
      # A pasted token often carries a stray space or newline, and the action
      # then fails in milliseconds with no reason given. Say what is wrong
      # instead. Prints nothing about the token beyond these two facts.
      - name: check the credential
        if: env.HAS_CREDENTIAL == 'true'
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ "$TOKEN" =~ [[:space:]] ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN contains a space or line break. Re-save the secret with only the token."
            exit 1
          fi
          if [[ "$TOKEN" != sk-ant-oat* ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not a subscription token (those start with sk-ant-oat). Run 'claude setup-token' and save its output."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CREDENTIAL == 'true'
        with:
          # Full history, so the agents can diff against the PR's base branch.
          fetch-depth: 0
          persist-credentials: false
      # The agents run cargo (probes, mutation testing), so they need the pinned
      # toolchain and a warm cache.
      - if: env.HAS_CREDENTIAL == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.HAS_CREDENTIAL == 'true'
      # Count by content, not by time: GitHub's clock and the runner's may differ,
      # and a rerun on the same head must add a summary of its own.
      - name: count earlier summaries
        if: env.HAS_CREDENTIAL == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          before=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments |
            jq --arg head "$SUMMARY_HEAD" '[.comments[] | select((.author.login | startswith("github-actions"))
              and (.body | startswith($head)))] | length')
          echo "SUMMARIES_BEFORE=$before" >> "$GITHUB_ENV"
      # A rerun starts from the newest summary's head, if that commit is still in
      # the PR's history (a force-push or a fresh PR falls back to a full review).
      - name: find the last reviewed head
        if: env.HAS_CREDENTIAL == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          last=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments |
            jq -r --arg pr "**Review summary (PR $PR, head " '[.comments[]
              | select((.author.login | startswith("github-actions")) and (.body | startswith($pr)))
              | .body | capture("head (?<sha>[0-9a-f]{40})").sha] | last // ""')
          if [[ -n $last && $last != "$HEAD_SHA" ]] && git merge-base --is-ancestor "$last" "$HEAD_SHA"; then
            echo "REVIEW_SINCE=$last" >> "$GITHUB_ENV"
          fi
      - uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        if: env.HAS_CREDENTIAL == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job's own token: scoped to the permissions above, expires with
          # the job. Comments appear as github-actions[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            MUTATION AUDIT REQUESTED: ${{ env.MUTATION_AUDIT }}
            LAST REVIEWED HEAD: ${{ env.REVIEW_SINCE }}

            You coordinate an adversarial review of this pull request using the
            project's agents in .claude/agents/. Diff against the base branch
            above (stacked PRs target their parent, not main):
            `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`.

            1. List the changed paths. Run these agents, each told the PR number, base
               branch, and head SHA. Start every agent with run_in_background: false and
               wait for its report: this run ends when you stop, and a background agent
               dies with it, so stopping with one still running posts nothing.
               Several foreground agent calls in one message still run in parallel.
               - pr-reviewer: always.
               - spec-reviewer: if anything under specs/ or CONSTITUTION.md changed.
               - docs-reviewer: if anything under crates/openplush-pipeline/src/,
                 bindings/, packages/engine-client/, specs/*/contracts/, or docs/
                 (docs/adr/ included) changed, or specs/*/tasks.md, README.md or
                 CONTRIBUTING.md changed.
               - mutation-auditor: only if MUTATION AUDIT REQUESTED is true and a
                 .rs file under crates/ changed. If it is false and engine code
                 changed, say in the summary that the auditor can be requested
                 with the `mutation-audit` label.
               Tell them this is CI: skip `scripts/check.sh wasm` (the wasm workflow
               covers it) and leave the working tree exactly as they found it.
               If LAST REVIEWED HEAD is set, this is a rerun: tell each agent to review
               only the hunks of `git diff <LAST REVIEWED HEAD>..HEAD` that are also in
               the PR diff (changes merged in from the base branch are not this PR's),
               using the rest of the PR diff as context only. Pick agents by the paths
               in that narrower diff. If it is empty, review the whole PR diff.
            2. Merge their findings. Drop duplicates and anything without evidence.
               Read the PR's earlier comments (`gh pr view <PR> --comments`) and drop
               any finding the author already fixed or answered, unless the new
               changes reopen it.
               Keep the severity marks: 🔴 blocking, 🟡 nit (optional), 🟣 pre-existing.
            3. Post each finding that points at a line of the diff as an inline
               comment with mcp__github_inline_comment__create_inline_comment and
               confirmed: true. Start each with its severity mark.

            4. Write the summary to a file under `${{ runner.temp }}` (never inside the
               checkout), then post it with
               `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`.
               Its first line is exactly
               `${{ env.SUMMARY_HEAD }}`
               (the job fails if no new comment starts that way). Then: every agent above
               as ran or skipped, with the reason for each skip, a line `Findings: 🔴 N, 🟡 N, 🟣 N.`, the mutation kill
               count if the auditor ran, findings that do not map to a diff line, and
               "Nothing blocking" if that is true. Add no attribution footer to any comment.
               Post it even when there are no findings or a step failed: say what
               ran and what did not.

            Never approve, request changes, push, or edit the checkout yourself. Verified
            findings only: a wrong finding costs the author more than a missed one.
          claude_args: >-
            --allowedTools "Task,Agent,Read,Grep,Glob,Edit,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(cargo:*),Bash(scripts/check.sh:*),Bash(cp:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
      - name: check a summary was posted
        if: env.HAS_CREDENTIAL == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          after=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments |
            jq --arg head "$SUMMARY_HEAD" '[.comments[] | select((.author.login | startswith("github-actions"))
              and (.body | startswith($head)))] | length')
          if ((after <= SUMMARIES_BEFORE)); then
            echo "::error::The review agent finished without posting a summary, so nothing was reviewed. Its transcript is in this run's artifacts; the maintainer can add the rereview label to run it again."
            exit 1
          fi
      # The artifact needs a browser and repository access to read; the log does not.
      # So when no summary was posted, print the agent's last words, its tool calls
      # and its result line, which is usually enough to see why it stopped.
      - name: show why the agent stopped
        if: failure() && env.HAS_CREDENTIAL == 'true'
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          [[ -f $f ]] || { echo "no transcript at $f"; exit 0; }
          jq -r '.[] | select(.type == "assistant") | .message.content[]?
            | if .type == "text" then "says: \(.text)"
              elif .type == "tool_use" then "calls \(.name): \(.input | tostring | .[0:300])"
              else empty end' "$f" | tail -n 40
          jq -r '.[] | select(.type == "user") | .message.content[]? | select(.type? == "tool_result")
            | "result: \(.content | tostring | .[0:300])"' "$f" | tail -n 20
          jq -r '.[] | select(.type == "result")
            | "final: \(.subtype), \(.num_turns) turns, \(.result // "" | .[0:1500])"' "$f"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.HAS_CREDENTIAL == 'true'
        with:
          name: review-transcript
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 7
          if-no-files-found: warn
