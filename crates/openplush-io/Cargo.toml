[package]
name = "openplush-io"
description = "Bytes to TriangleSoup: OBJ, glTF, STL, PLY"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
openplush-geom = { path = "../openplush-geom" }
openplush-mesh = { path = "../openplush-mesh" }
thiserror = "2.0.21"
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
gltf = { version = "1.4.1", default-features = false, features = ["names"] }

[dev-dependencies]
openplush-testkit = { path = "../openplush-testkit" }

[lints]
workspace = true
