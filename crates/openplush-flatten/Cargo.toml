[package]
name = "openplush-flatten"
description = "Charts, Tutte/LSCM initialization, SLIM/ARAP, distortion metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# No default features: they pull in rayon, which neither wasm32 nor `deny.toml` allows.
faer = { version = "0.24.4", default-features = false, features = ["sparse-linalg"] }
libm = "0.2.16"
openplush-geom = { path = "../openplush-geom" }
openplush-mesh = { path = "../openplush-mesh" }
openplush-seams = { path = "../openplush-seams" }
thiserror = "2.0.21"

[dev-dependencies]
openplush-testkit = { path = "../openplush-testkit" }

[lints]
workspace = true
