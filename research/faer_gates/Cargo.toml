# Non-shipping spike. The empty [workspace] table keeps it out of the root
# workspace (members = ["crates/*"]) and gives it its own Cargo.lock.
[workspace]

[package]
name = "faer-gates"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[features]
# Configuration B adds `faer/std`; configuration A is the default build.
std = ["faer/std"]

[dependencies]
# Exact pin: the findings are about this version. No default features: they pull rayon.
faer = { version = "=0.24.4", default-features = false, features = ["sparse-linalg"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# Same versions as the root Cargo.lock, so the installed test runner matches.
wasm-bindgen = "=0.2.129"
wasm-bindgen-test = "=0.3.79"
