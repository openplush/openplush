# Non-shipping spike. The empty [workspace] table keeps it out of the root
# workspace (members = ["crates/*"]) and gives it its own Cargo.lock.
[workspace]

[package]
name = "s5-svg2pdf-wasm"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[features]
# svg2pdf's own defaults (image, filters, text). Off in the harness; on only to
# inventory and size the default graph. The repo's deny.toml sets
# all-features = true, so `cargo deny` checks this superset either way.
svg2pdf-default = ["svg2pdf/default"]

[dependencies]
# Exact pins: the findings are about these versions.
svg2pdf = { version = "=0.13.0", default-features = false }
pdf-writer = "=0.15.0"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# Same versions as the root Cargo.lock, so the installed test runner matches.
wasm-bindgen = "=0.2.129"
wasm-bindgen-test = "=0.3.79"

# Size probes: plain extern "C" cdylibs, so the .wasm holds only what each
# writer needs (no wasm-bindgen glue).
[[example]]
name = "probe_empty"
crate-type = ["cdylib"]

[[example]]
name = "probe_direct"
crate-type = ["cdylib"]

[[example]]
name = "probe_svg2pdf"
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
