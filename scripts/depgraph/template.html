<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenPlush Dependency Graph</title>
<script>__D3__</script>
<style>
:root {
  --bg: #282c33; --canvas: #1f2228; --panel: #2f343e; --panel-2: #363c46; --border: #464b57;
  --text: #dce0e5; --muted: #a9afbc; --faint: #6e7684; --accent: #74ade8; --hl-out: #74ade8; --hl-in: #dec184;
  --mono: "Zed Mono", "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: "Zed Sans", Inter, -apple-system, "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
#app { display: grid; grid-template-rows: auto 1fr; grid-template-columns: 260px 1fr auto; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--bg); flex-wrap: wrap; }
header h1 { font-size: 14px; font-weight: 600; margin: 0 6px 0 0; white-space: nowrap; }
header h1 span { color: var(--faint); font-weight: 400; }
header a.back, .note a { color: var(--accent); text-decoration: none; }
header a.back:hover, .note a:hover { text-decoration: underline; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 4px 10px; cursor: pointer; color: var(--muted); border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--panel-2); color: var(--text); }
.seg button kbd { margin-right: 6px; }
kbd { font: 11px var(--mono); color: var(--faint); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; }
#crumbs { display: flex; gap: 6px; align-items: center; color: var(--muted); flex: 1; min-width: 160px; font-family: var(--mono); font-size: 12px; }
#crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
#crumbs a:hover { text-decoration: underline; }
#crumbs .sep { color: var(--faint); }
.search { position: relative; }
.search input { width: 240px; background: var(--canvas); border: 1px solid var(--border); border-radius: 6px; padding: 4px 28px 4px 8px; outline: none; }
.search input:focus { border-color: var(--accent); }
.search kbd { position: absolute; right: 6px; top: 5px; }
select { background: var(--canvas); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }
aside#side { border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 14px; background: var(--bg); }
aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 16px 0 8px; font-weight: 600; }
aside h2:first-child { margin-top: 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
.stat b { display: block; font: 600 18px var(--mono); }
.stat small { color: var(--muted); }
ol.top { margin: 0; padding: 0; list-style: none; }
ol.top li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 4px; border-radius: 4px; cursor: pointer; font-family: var(--mono); font-size: 12px; }
ol.top li:hover { background: var(--panel); }
ol.top li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ol.top li span:last-child { color: var(--muted); }
.chips { display: flex; flex-direction: column; gap: 2px; }
.chip { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 4px; cursor: pointer; user-select: none; }
.chip:hover { background: var(--panel); }
.chip.off { opacity: .4; }
.chip.off .dot { background: transparent !important; }
.chip .count { margin-left: auto; color: var(--faint); font: 11px var(--mono); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 2px solid; }
.legend div { display: flex; align-items: center; gap: 8px; padding: 2px 4px; font-size: 12px; }
.ramp { height: 10px; border-radius: 3px; margin: 4px 4px 2px; }
.ramp-labels { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--faint); margin: 0 4px; }
.keys div { display: flex; justify-content: space-between; padding: 2px 4px; color: var(--muted); font-size: 12px; }
.note { color: var(--faint); font-size: 12px; margin-top: 6px; }
main { position: relative; background: var(--canvas); overflow: hidden; }
main svg { width: 100%; height: 100%; display: block; cursor: grab; }
main svg:active { cursor: grabbing; }
#hint { position: absolute; left: 12px; bottom: 10px; color: var(--faint); font-size: 12px; pointer-events: none; }
#tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: 12px var(--mono); display: none; max-width: 420px; box-shadow: 0 4px 16px #0006; }
#tip .p { color: var(--muted); }
aside#detail { width: 0; overflow: hidden; border-left: 1px solid var(--border); background: var(--bg); transition: width .15s; }
aside#detail.open { width: 340px; }
#detail .inner { width: 340px; height: 100%; overflow-y: auto; padding: 12px 14px; }
#detail .title { display: flex; align-items: start; gap: 8px; }
#detail h3 { margin: 0; font-size: 15px; word-break: break-all; flex: 1; }
#detail .close { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; }
#detail .path { font: 12px var(--mono); color: var(--muted); word-break: break-all; margin: 4px 0 10px; }
#detail table { width: 100%; border-collapse: collapse; font-size: 12px; }
#detail td { padding: 3px 0; border-bottom: 1px solid #3a3f4a; }
#detail td:first-child { color: var(--muted); width: 45%; }
#detail td:last-child { font-family: var(--mono); }
#detail ul { list-style: none; padding: 0; margin: 0; max-height: 240px; overflow-y: auto; }
#detail li { display: flex; gap: 6px; padding: 2px 4px; border-radius: 4px; cursor: pointer; font: 12px var(--mono); }
#detail li:hover { background: var(--panel); }
#detail li .k { margin-left: auto; color: var(--faint); }
#detail .drill { margin-top: 12px; width: 100%; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 6px; cursor: pointer; }
#detail .drill:hover { border-color: var(--accent); }
.node { cursor: pointer; }
.node circle { stroke-width: 1.5; }
.node text { pointer-events: none; fill: var(--text); paint-order: stroke; stroke: var(--canvas); stroke-width: 3px; stroke-linejoin: round; }
.link { fill: none; stroke: #5b6170; }
.hull { stroke-width: 1; stroke-dasharray: 3 3; }
.hull-label { fill: var(--faint); font: 11px var(--mono); text-transform: none; pointer-events: none; }
.dim { opacity: .12; }
.ghost { opacity: .45; }
.match circle { stroke: #fff !important; stroke-width: 3; }
@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  aside#side { display: none; }
  aside#detail.open { position: absolute; right: 0; top: 0; bottom: 0; width: min(340px, 100vw); z-index: 2; }
  .search input { width: 160px; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="back" href="../index.html" title="Back to the contributor docs">← Docs</a>
    <h1 id="title"></h1>
    <div class="seg" id="levels">
      <button data-l="1"><kbd>1</kbd>System</button>
      <button data-l="2"><kbd>2</kbd>Modules</button>
      <button data-l="3"><kbd>3</kbd>Full graph</button>
    </div>
    <nav id="crumbs"></nav>
    <label>Color <select id="colorBy">
      <option value="category">Category</option>
      <option value="language">Language</option>
      <option value="depth">Dependency depth</option>
    </select></label>
    <div class="search"><input id="q" placeholder="Search modules…" autocomplete="off" spellcheck="false"><kbd>/</kbd></div>
  </header>
  <aside id="side">
    <h2>Stats</h2>
    <div class="stats" id="stats"></div>
    <h2>Most connected</h2>
    <ol class="top" id="top"></ol>
    <h2>Filter by category</h2>
    <div class="chips" id="chips"></div>
    <h2 id="legendTitle">Legend</h2>
    <div class="legend" id="legend"></div>
    <h2>Shortcuts</h2>
    <div class="keys">
      <div><span>Switch level</span><span><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></span></div>
      <div><span>Search</span><kbd>/</kbd></div>
      <div><span>Reset view</span><kbd>R</kbd></div>
      <div><span>Close / clear</span><kbd>Esc</kbd></div>
      <div><span>Drill down</span><span>double-click</span></div>
    </div>
    <h2>Source</h2>
    <div class="note" id="source"></div>
    <div class="note">Drawn with D3 (<a href="LICENSE-d3.txt">ISC licence</a>), bundled into this page.</div>
  </aside>
  <main>
    <svg id="svg"></svg>
    <div id="tip"></div>
    <div id="hint"></div>
  </main>
  <aside id="detail"><div class="inner" id="detailInner"></div></aside>
</div>
<script id="graph-data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById("graph-data").textContent);

const CATS = ["Frontend", "Backend", "Core", "Database", "Tests", "Tools", "Research", "Docs", "External"];
const CAT_COLOR = { Frontend: "#74ade8", Backend: "#b477cf", Core: "#a1c181", Database: "#dec184", Tests: "#bf956a",
  Tools: "#6eb4bf", Research: "#e5c07b", Docs: "#878e98", External: "#d07277" };
const LANG_COLOR = { Rust: "#dea584", TypeScript: "#5a9de0", Python: "#e0c45c", Shell: "#89e051", YAML: "#cb6fa3",
  Markdown: "#9aa3ad", JSON: "#c8a35a", TOML: "#9c4221", OBJ: "#7e8fa3", SVG: "#ff9a5a", Other: "#6e7684" };
const LEVEL_NAME = { 1: "System overview", 2: "Module view", 3: "Full dependency graph" };
const L2_LIMIT = 45, L1_MAJOR = 5;

// Per-level adjacency over the full data, so details list every edge even when a view hides some.
const LEVELS = {};
for (const l of [1, 2, 3]) {
  const d = DATA["l" + l], byId = new Map(d.nodes.map(n => [n.id, n])), out = new Map(), inn = new Map();
  for (const e of d.links) {
    (out.get(e.source) || out.set(e.source, []).get(e.source)).push(e);
    (inn.get(e.target) || inn.set(e.target, []).get(e.target)).push(e);
  }
  for (const n of d.nodes) { n.in ??= (inn.get(n.id) || []).length; n.out ??= (out.get(n.id) || []).length; }
  LEVELS[l] = { ...d, byId, out, inn };
}
const maxDepth = d3.max(DATA.l3.nodes, n => n.depth);
const depthColor = d3.scaleSequential(d3.interpolatePlasma).domain([maxDepth, 0]);
const PKG_LABEL = new Map(DATA.l2.nodes.map(n => [n.id, n.label]));

const state = { level: 1, cat: null, pkg: null, hidden: new Set(), colorBy: "category", query: "", selected: null };

const svg = d3.select("#svg"), root = svg.append("g");
const defs = svg.append("defs");
const zoom = d3.zoom().scaleExtent([0.05, 8]).on("zoom", e => { root.attr("transform", e.transform); updateLabelVisibility(e.transform.k); });
svg.call(zoom).on("dblclick.zoom", null);
svg.on("click", e => { if (e.target === svg.node()) select(null); });
let sim = null, view = null;

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "on" ? Object.entries(v).forEach(([ev, f]) => n.addEventListener(ev, f)) : n.setAttribute(k, v);
  for (const k of kids) n.append(k);
  return n;
}
const fmt = d3.format(",");

function colorOf(n) {
  if (state.colorBy === "language") return LANG_COLOR[n.lang] || LANG_COLOR.Other;
  if (state.colorBy === "depth") return depthColor(n.depth ?? 0);
  return CAT_COLOR[n.cat];
}

// ---------- graph builders ----------
function buildL1() {
  const L = LEVELS[1];
  const nodes = L.nodes.filter(n => !state.hidden.has(n.id)).map(n => ({ ...n, r: n.files ? 34 + Math.sqrt(n.files) * 4.2 : 30, depth: 0 }));
  const ids = new Set(nodes.map(n => n.id));
  const links = L.links.filter(e => e.weight >= L1_MAJOR && ids.has(e.source) && ids.has(e.target)).map(e => ({ ...e }));
  return { nodes, links };
}
function buildL2() {
  const L = LEVELS[2];
  let pool = L.nodes.filter(n => !state.hidden.has(n.cat));
  let core;
  if (state.cat) core = pool.filter(n => n.cat === state.cat);
  else core = [...pool].sort((a, b) => b.score - a.score).slice(0, L2_LIMIT);
  const ids = new Set(core.map(n => n.id)), ghosts = new Set();
  if (state.cat) for (const e of L.links) {
    if (ids.has(e.source) && !ids.has(e.target)) ghosts.add(e.target);
    if (ids.has(e.target) && !ids.has(e.source)) ghosts.add(e.source);
  }
  const all = core.concat(pool.filter(n => ghosts.has(n.id)));
  const show = new Set(all.map(n => n.id));
  const nodes = all.map(n => ({ ...n, ghost: ghosts.has(n.id), r: 6 + Math.sqrt(n.score) * 2.6, depth: pkgDepth(n.id) }));
  const links = L.links.filter(e => show.has(e.source) && show.has(e.target)).map(e => ({ ...e }));
  return { nodes, links };
}
function pkgDepth(pkg) { return d3.max(DATA.l3.nodes.filter(n => n.pkg === pkg), n => n.depth) ?? 0; }
function buildL3() {
  const L = LEVELS[3];
  const pool = L.nodes.filter(n => !state.hidden.has(n.cat));
  const inScope = n => state.pkg ? n.pkg === state.pkg : state.cat ? n.cat === state.cat : true;
  const core = new Set(pool.filter(inScope).map(n => n.id)), ghosts = new Set();
  if (state.pkg || state.cat) for (const e of L.links) {
    if (core.has(e.source) && !core.has(e.target)) ghosts.add(e.target);
    if (core.has(e.target) && !core.has(e.source)) ghosts.add(e.source);
  }
  const nodes = pool.filter(n => core.has(n.id) || ghosts.has(n.id))
    .map(n => ({ ...n, ghost: ghosts.has(n.id), r: (n.kind === "group" ? 5 : 3) + Math.sqrt(n.in) * 1.8 }));
  const show = new Set(nodes.map(n => n.id));
  const links = L.links.filter(e => show.has(e.source) && show.has(e.target)).map(e => ({ ...e }));
  return { nodes, links };
}

// ---------- rendering ----------
function render(keepZoom = false) {
  if (sim) sim.stop();
  root.selectAll("*").remove();
  defs.selectAll("*").remove();
  const g = state.level === 1 ? buildL1() : state.level === 2 ? buildL2() : buildL3();
  view = { ...g, byId: new Map(g.nodes.map(n => [n.id, n])) };

  defs.append("marker").attr("id", "arrow").attr("viewBox", "0 -5 10 10").attr("refX", 9).attr("markerUnits", "userSpaceOnUse")
    .attr("markerWidth", state.level === 1 ? 14 : 9).attr("markerHeight", state.level === 1 ? 14 : 9).attr("orient", "auto").append("path").attr("d", "M0,-4L10,0L0,4").attr("fill", "#7a8190");

  const hullLayer = root.append("g");
  const linkSel = root.append("g").selectAll("path").data(g.links).join("path").attr("class", "link")
    .attr("stroke-width", e => state.level === 3 ? 0.6 : Math.max(1, Math.sqrt(e.weight) * (state.level === 1 ? 0.9 : 0.8)))
    .attr("stroke-opacity", state.level === 3 ? 0.35 : 0.6)
    .attr("marker-end", state.level === 3 ? null : "url(#arrow)");

  const nodeSel = root.append("g").selectAll("g").data(g.nodes, d => d.id).join("g")
    .attr("class", d => "node" + (d.ghost ? " ghost" : ""))
    .on("click", (e, d) => { e.stopPropagation(); select(d.id); })
    .on("dblclick", (e, d) => { e.stopPropagation(); drill(d); })
    .on("mouseenter", (e, d) => { showTip(e, d); hover(d.id); })
    .on("mousemove", moveTip)
    .on("mouseleave", () => { hideTip(); hover(null); })
    .call(d3.drag()
      .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

  nodeSel.append("circle").attr("r", d => d.r)
    .attr("fill", d => fillOf(d)).attr("stroke", d => colorOf(d))
    .attr("stroke-dasharray", d => state.level === 1 && !d.files ? "4 4" : null);

  drawLabels(nodeSel);
  sim = makeSimulation(g);
  const W = svg.node().clientWidth || 1000, H = svg.node().clientHeight || 700;
  for (let i = 0; i < (state.level === 3 ? 260 : 320); i++) sim.tick();

  function ticked() {
    linkSel.attr("d", e => edgePath(e));
    nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
    if (state.level === 2) drawHulls(hullLayer, g.nodes);
  }
  ticked();
  sim.on("tick", ticked).alpha(0.02).alphaDecay(0.05).restart();
  view.linkSel = linkSel; view.nodeSel = nodeSel;
  if (!keepZoom) fit(W, H);
  applyHighlights();
  updateChrome();
}

function drawLabels(nodeSel) {
  if (state.level === 1) {
    nodeSel.append("text").attr("text-anchor", "middle").attr("dy", "-0.35em").attr("font-weight", 600).attr("font-size", 15).text(d => d.label);
    nodeSel.append("text").attr("text-anchor", "middle").attr("dy", "1.1em").attr("font-size", 11).attr("fill", "#a9afbc")
      .text(d => d.files ? `${fmt(d.files)} ${d.id === "External" ? "packages" : "files"}` : "none detected");
    nodeSel.append("text").attr("text-anchor", "middle").attr("dy", "2.4em").attr("font-size", 11).attr("fill", "#a9afbc")
      .text(d => d.files ? d.lang : "");
  } else {
    nodeSel.append("text").attr("class", "lbl").attr("text-anchor", "middle").attr("dy", d => d.r + 12)
      .attr("font-size", state.level === 2 ? 11 : 9).attr("font-family", "var(--mono)").text(d => d.label);
  }
}

function makeSimulation(g) {
  const sim = d3.forceSimulation(g.nodes).stop();
  if (state.level === 1) {
    sim.force("link", d3.forceLink(g.links).id(d => d.id).distance(260).strength(0.15))
      .force("charge", d3.forceManyBody().strength(-2200))
      .force("collide", d3.forceCollide(d => d.r + 40))
      .force("x", d3.forceX(0).strength(d => d.files ? 0.05 : 0.3)).force("y", d3.forceY(0).strength(d => d.files ? 0.07 : 0.3));
  } else if (state.level === 2) {
    const parents = [...new Set(g.nodes.map(n => n.parent))].sort();
    const R = 140 + parents.length * 28, centers = new Map(parents.map((p, i) => {
      const a = (i / parents.length) * 2 * Math.PI; return [p, [Math.cos(a) * R, Math.sin(a) * R]];
    }));
    sim.force("link", d3.forceLink(g.links).id(d => d.id).distance(90).strength(0.02))
      .force("charge", d3.forceManyBody().strength(-260))
      .force("collide", d3.forceCollide(d => d.r + 14))
      .force("x", d3.forceX(d => centers.get(d.parent)[0]).strength(0.22))
      .force("y", d3.forceY(d => centers.get(d.parent)[1]).strength(0.22));
  } else {
    const cats = CATS.filter(c => g.nodes.some(n => n.cat === c));
    const R = 260 + Math.sqrt(g.nodes.length) * 12, centers = new Map(cats.map((c, i) => {
      const a = (i / cats.length) * 2 * Math.PI; return [c, [Math.cos(a) * R, Math.sin(a) * R]];
    }));
    sim.force("link", d3.forceLink(g.links).id(d => d.id).distance(36).strength(0.25))
      .force("charge", d3.forceManyBody().strength(-45).distanceMax(500))
      .force("collide", d3.forceCollide(d => d.r + 2))
      .force("x", d3.forceX(d => centers.get(d.cat)[0]).strength(0.04))
      .force("y", d3.forceY(d => centers.get(d.cat)[1]).strength(0.04));
  }
  return sim;
}

function fillOf(d) { const c = d3.color(colorOf(d)); return state.level === 3 ? c.formatHex() : c.copy({ opacity: 0.22 }).formatRgb(); }

function edgePath(e) {
  const s = e.source, t = e.target, dx = t.x - s.x, dy = t.y - s.y, dist = Math.hypot(dx, dy) || 1;
  const ux = dx / dist, uy = dy / dist, x1 = s.x + ux * s.r, y1 = s.y + uy * s.r, x2 = t.x - ux * (t.r + 2), y2 = t.y - uy * (t.r + 2);
  if (state.level === 3) return `M${x1},${y1}L${x2},${y2}`;
  const bend = state.level === 1 ? 0.18 : 0.12, mx = (x1 + x2) / 2 - uy * dist * bend, my = (y1 + y2) / 2 + ux * dist * bend;
  return `M${x1},${y1}Q${mx},${my} ${x2},${y2}`;
}

function drawHulls(layer, nodes) {
  const groups = d3.groups(nodes.filter(n => !n.ghost), n => n.parent);
  const sel = layer.selectAll("g.h").data(groups, d => d[0]).join(enter => {
    const g = enter.append("g").attr("class", "h");
    g.append("path").attr("class", "hull");
    g.append("text").attr("class", "hull-label").attr("text-anchor", "middle");
    return g;
  });
  sel.each(function ([parent, ns]) {
    const pts = [];
    for (const n of ns) for (let a = 0; a < 8; a++) pts.push([n.x + Math.cos(a * Math.PI / 4) * (n.r + 16), n.y + Math.sin(a * Math.PI / 4) * (n.r + 16)]);
    const hull = d3.polygonHull(pts), c = CAT_COLOR[d3.greatest(d3.rollups(ns, v => v.length, n => n.cat), d => d[1])[0]];
    d3.select(this).select("path").attr("d", hull ? "M" + hull.join("L") + "Z" : null)
      .attr("fill", d3.color(c).copy({ opacity: 0.05 })).attr("stroke", d3.color(c).copy({ opacity: 0.45 }));
    const top = d3.min(pts, p => p[1]), cx = d3.mean(ns, n => n.x);
    d3.select(this).select("text").attr("x", cx).attr("y", top - 6).text(parent + "/");
  });
}

function fit(W, H) {
  const ns = view.nodes; if (!ns.length) return;
  const x0 = d3.min(ns, n => n.x - n.r), x1 = d3.max(ns, n => n.x + n.r), y0 = d3.min(ns, n => n.y - n.r), y1 = d3.max(ns, n => n.y + n.r + 14);
  const k = Math.min(2, 0.9 * Math.min(W / (x1 - x0 || 1), H / (y1 - y0 || 1)));
  svg.call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2));
}
function updateLabelVisibility(k) {
  if (!view || state.level !== 3) return;
  view.nodeSel.select("text.lbl").attr("display", d => (d.in >= 10 || k > 1.6 || d.id === state.selected || isMatch(d) || (state.pkg && !d.ghost)) ? null : "none");
}

// ---------- highlight, search, selection ----------
function isMatch(d) { const q = state.query; return q && (d.label.toLowerCase().includes(q) || (d.path || d.id).toLowerCase().includes(q)); }
function neighbours(id) {
  const s = new Set([id]);
  for (const e of view.links) { if (e.source.id === id) s.add(e.target.id); if (e.target.id === id) s.add(e.source.id); }
  return s;
}
function applyHighlights(hoverId = null) {
  if (!view) return;
  const focus = hoverId || state.selected, nb = focus && view.byId.has(focus) ? neighbours(focus) : null;
  const anyMatch = state.query && view.nodes.some(isMatch);
  view.nodeSel.classed("match", d => isMatch(d))
    .classed("dim", d => (nb && !nb.has(d.id)) || (!nb && anyMatch && !isMatch(d)));
  view.linkSel
    .classed("dim", e => (nb && e.source.id !== focus && e.target.id !== focus) || (!nb && anyMatch))
    .attr("stroke", e => !nb ? null : e.source.id === focus ? "var(--hl-out)" : e.target.id === focus ? "var(--hl-in)" : null)
    .attr("stroke-opacity", e => nb && (e.source.id === focus || e.target.id === focus) ? 0.95 : state.level === 3 ? 0.35 : 0.6);
  updateLabelVisibility(d3.zoomTransform(svg.node()).k);
}
function hover(id) { applyHighlights(id); }

function select(id) {
  state.selected = id;
  applyHighlights();
  renderDetail();
}
function selectAnywhere(level, id) {
  if (level !== state.level) return;
  if (!view.byId.has(id)) {
    const n = LEVELS[level].byId.get(id);
    if (level === 3) { state.pkg = n.pkg; state.cat = null; }
    else if (level === 2) state.cat = n.cat;
    state.hidden.delete(n.cat);
    render();
  }
  select(id);
  centerOn(id);
}
function centerOn(id) {
  const n = view.byId.get(id); if (!n) return;
  const t = d3.zoomTransform(svg.node()), W = svg.node().clientWidth, H = svg.node().clientHeight, k = Math.max(t.k, state.level === 3 ? 1.4 : t.k);
  svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-n.x, -n.y));
}

function drill(d) {
  if (state.level === 1) { if (!d.files) return; state.cat = d.id; state.pkg = null; setLevel(2, false); }
  else if (state.level === 2) { state.pkg = d.id; setLevel(3, false); }
  else if (d.pkg) { state.pkg = d.pkg; render(); select(d.id); centerOn(d.id); }
}
function setLevel(l, clear = true) {
  if (clear) { if (l === 1) { state.cat = null; state.pkg = null; } if (l === 2) state.pkg = null; }
  state.level = l; state.selected = null;
  render(); renderDetail();
}

// ---------- side chrome ----------
function updateChrome() {
  d3.selectAll("#levels button").classed("on", function () { return +this.dataset.l === state.level; });
  const crumbs = document.getElementById("crumbs"); crumbs.replaceChildren();
  const parts = [[DATA.project, () => setLevel(1)]];
  if (state.level >= 2) parts.push([state.cat ? `${state.cat}` : "Top modules", () => { state.pkg = null; setLevel(2, false); }]);
  if (state.level === 3) parts.push([state.pkg ? (PKG_LABEL.get(state.pkg) || state.pkg) : state.cat ? "all files" : "All modules", () => {}]);
  parts.forEach(([label, fn], i) => {
    if (i) crumbs.append(el("span", { class: "sep" }, "›"));
    crumbs.append(i === parts.length - 1 ? el("span", {}, label) : el("a", { on: { click: fn } }, label));
  });
  crumbs.append(el("span", { class: "sep" }, " · " + LEVEL_NAME[state.level]));

  const L = LEVELS[state.level], totalNodes = L.nodes.filter(n => !(state.level === 1 && !n.files)).length;
  const stats = document.getElementById("stats"); stats.replaceChildren();
  const stat = (v, label) => stats.append(el("div", { class: "stat" }, el("b", {}, fmt(v)), el("small", {}, label)));
  stat(view.nodes.length, `${state.level === 1 ? "subsystems" : state.level === 2 ? "packages" : "modules"} shown`);
  stat(view.links.length, "dependencies shown");
  stat(totalNodes, "total at this level");
  stat(L.links.reduce((s, e) => s + (e.weight || 1), 0), state.level === 3 ? "total dependencies" : "file-level edges");

  const deg = n => (L.out.get(n.id) || []).length + (L.inn.get(n.id) || []).length;
  const top = document.getElementById("top"); top.replaceChildren();
  L.nodes.filter(n => !state.hidden.has(n.cat))
    .sort((a, b) => deg(b) - deg(a)).slice(0, 8)
    .forEach(n => top.append(el("li", { title: n.path || n.id, on: { click: () => selectAnywhere(state.level, n.id) } },
      el("span", {}, n.label), el("span", { title: "dependents ↓ / dependencies ↑" }, `${n.in}↓ ${n.out}↑`))));

  const chips = document.getElementById("chips"); chips.replaceChildren();
  for (const c of CATS) {
    const count = state.level === 1 ? (LEVELS[1].byId.get(c)?.files || 0) : L.nodes.filter(n => n.cat === c).length;
    const chip = el("div", { class: "chip" + (state.hidden.has(c) ? " off" : ""), on: { click: () => toggleCat(c) } },
      el("span", { class: "dot" }), c, el("span", { class: "count" }, fmt(count)));
    chip.firstChild.style.background = CAT_COLOR[c]; chip.firstChild.style.borderColor = CAT_COLOR[c];
    chips.append(chip);
  }
  renderLegend();
  document.getElementById("hint").textContent = state.level === 1
    ? `Major connections only (≥ ${L1_MAJOR} file-level edges). Double-click a subsystem to open its modules.`
    : state.level === 2 ? (state.cat ? `All ${state.cat} packages; faded nodes are their neighbours.` : `Top ${L2_LIMIT} packages by (dependents × 3) + (lines / 100), clustered by parent directory.`) + " Double-click to open its files."
    : "Blue edges: what the selection depends on. Yellow: what depends on it.";
}
function renderLegend() {
  const lg = document.getElementById("legend"); lg.replaceChildren();
  const t = document.getElementById("legendTitle");
  if (state.colorBy === "depth") {
    t.textContent = "Dependency depth";
    const ramp = el("div", { class: "ramp" });
    ramp.style.background = `linear-gradient(90deg, ${d3.range(0, 1.01, 0.1).map(v => depthColor(maxDepth * v)).join(",")})`;
    lg.append(ramp, el("div", { class: "ramp-labels" }, el("span", {}, "0 leaf"), el("span", {}, `${maxDepth} deep`)));
    lg.append(el("div", { class: "note" }, "Longest chain of internal dependencies below a module (cycles collapsed)."));
    return;
  }
  if (state.colorBy === "language") {
    t.textContent = "Language";
    const langs = d3.rollups(view.nodes, v => v.length, n => n.lang).sort((a, b) => b[1] - a[1]);
    for (const [lang, n] of langs) {
      const d = el("span", { class: "dot" }); d.style.background = d.style.borderColor = LANG_COLOR[lang] || LANG_COLOR.Other;
      lg.append(el("div", {}, d, `${lang} (${n})`));
    }
    return;
  }
  t.textContent = "Size";
  lg.append(el("div", { class: "note" }, state.level === 1 ? "Circle area grows with file count." :
    state.level === 2 ? "Radius ∝ √((dependents × 3) + lines / 100)." : "Radius ∝ √(dependents). Larger = more modules depend on it."));
}
function toggleCat(c) { state.hidden.has(c) ? state.hidden.delete(c) : state.hidden.add(c); state.selected = null; render(); renderDetail(); }

// ---------- details panel ----------
function renderDetail() {
  const panel = document.getElementById("detail"), inner = document.getElementById("detailInner");
  const id = state.selected, L = LEVELS[state.level], n = id && L.byId.get(id);
  panel.classList.toggle("open", !!n);
  inner.replaceChildren(); if (!n) return;
  const dot = el("span", { class: "dot" }); dot.style.background = dot.style.borderColor = colorOf({ ...n, depth: n.depth ?? pkgDepth(n.id) });
  inner.append(el("div", { class: "title" }, dot, el("h3", {}, n.label), el("button", { class: "close", title: "Close (Esc)", on: { click: () => select(null) } }, "×")));
  inner.append(el("div", { class: "path" }, state.level === 1 ? (n.dirs || []).map(d => d[0]).join("  ") : (n.path || n.id)));
  const rows = [["Category", n.cat], ["Primary language", n.lang]];
  if (state.level === 1) rows.push(["Files", fmt(n.files)], ["Non-blank lines", fmt(n.loc)], ["Graph modules", fmt(n.modules)],
    ["Languages", (n.langs || []).map(l => l[0]).join(", ")]);
  if (state.level === 2) rows.push(["Files", fmt(n.files)], ["Non-blank lines", fmt(n.loc)], ["Dependent packages", n.in], ["Packages it uses", n.out], ["Importance score", n.score]);
  if (state.level === 3) rows.push(["Kind", n.kind], ["Non-blank lines", fmt(n.loc)], ["Package", PKG_LABEL.get(n.pkg) || n.pkg], ["Dependents", n.in], ["Dependencies", n.out], ["Dependency depth", n.depth]);
  if (n.files && state.level === 3) rows.push(["Files in group", n.files]);
  inner.append(el("table", {}, ...rows.map(([k, v]) => el("tr", {}, el("td", {}, k), el("td", {}, String(v))))));
  const list = (title, edges, end) => {
    if (!edges.length) return;
    inner.append(el("h2", {}, `${title} (${edges.length})`));
    const sorted = [...edges].sort((a, b) => (b.weight || 0) - (a.weight || 0) || L.byId.get(a[end]).label.localeCompare(L.byId.get(b[end]).label));
    inner.append(el("ul", {}, ...sorted.map(e => el("li", { title: e[end], on: { click: () => selectAnywhere(state.level, e[end]) } },
      el("span", {}, L.byId.get(e[end]).label), el("span", { class: "k" }, e.kind || `${e.weight} edges`)))));
  };
  list("Depends on", L.out.get(id) || [], "target");
  list("Used by", L.inn.get(id) || [], "source");
  if (state.level < 3 && (state.level === 2 || n.files))
    inner.append(el("button", { class: "drill", on: { click: () => drill(n) } }, state.level === 1 ? "Open modules →" : "Open files →"));
}

// ---------- tooltip ----------
const tip = document.getElementById("tip");
function showTip(e, d) {
  tip.replaceChildren(el("div", {}, d.label), el("div", { class: "p" },
    state.level === 1 ? `${fmt(d.files)} files · ${d.lang} · ${fmt(d.loc)} lines`
      : state.level === 2 ? `${d.id} · ${d.in} dependents · ${fmt(d.loc)} lines`
      : `${d.path} · ${d.in} in / ${d.out} out`));
  tip.style.display = "block"; moveTip(e);
}
function moveTip(e) { const r = tip.parentNode.getBoundingClientRect(); tip.style.left = (e.clientX - r.left + 14) + "px"; tip.style.top = (e.clientY - r.top + 14) + "px"; }
function hideTip() { tip.style.display = "none"; }

// ---------- wiring ----------
document.getElementById("title").append(DATA.project, el("span", {}, " dependency graph"));
document.getElementById("source").textContent =
  `Detected: ${DATA.detected.join(", ")}. ${DATA.manifests.length} manifests. Edges come from Rust use/mod paths and Cargo.toml, TypeScript imports, Python imports (stdlib omitted), ts-rs codegen, and path references in scripts, CI, docs and agent config.`;
d3.selectAll("#levels button").on("click", function () { setLevel(+this.dataset.l); });
const q = document.getElementById("q");
q.addEventListener("input", () => { state.query = q.value.trim().toLowerCase(); applyHighlights(); });
q.addEventListener("keydown", e => {
  if (e.key === "Enter") { const m = view.nodes.find(isMatch); if (m) { select(m.id); centerOn(m.id); } }
  if (e.key === "Escape") { q.value = ""; state.query = ""; applyHighlights(); q.blur(); }
});
document.getElementById("colorBy").addEventListener("change", e => {
  state.colorBy = e.target.value;
  view.nodeSel.select("circle").attr("fill", d => fillOf(d)).attr("stroke", d => colorOf(d));
  renderLegend(); renderDetail();
});
document.addEventListener("keydown", e => {
  if (e.target === q || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); q.focus(); q.select(); }
  else if (e.key === "1" || e.key === "2" || e.key === "3") setLevel(+e.key);
  else if (e.key === "r" || e.key === "R") { state.hidden.clear(); state.query = ""; q.value = ""; state.selected = null; render(); renderDetail(); }
  else if (e.key === "Escape") select(null);
});
let resizeTimer; window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => fit(svg.node().clientWidth, svg.node().clientHeight), 150); });
render();
</script>
</body>
</html>
