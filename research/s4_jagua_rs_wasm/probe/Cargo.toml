# Bundle-size probe. Without features it is the empty wasm-bindgen baseline;
# `--features jagua` links the S4 harness. Its own [workspace] keeps it standalone.
[workspace]

[package]
name = "s4-size-probe"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
jagua = ["dep:s4-jagua-rs-wasm"]

[dependencies]
s4-jagua-rs-wasm = { path = "..", optional = true }
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
