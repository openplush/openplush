# Engine gates. Runs on every PR, including PRs stacked on another branch.
name: engine

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs only. On main, every merge of a stack needs its own
  # green run, so pushes there must not cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    # pull-requests: read lets the attribution step read the PR's description.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The attribution step walks base..head; a shallow clone cuts that
          # range off and would list commits from before base.
          fetch-depth: 0
      # Installs exactly what rust-toolchain.toml pins (toolchain = MSRV).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The same entry point contributors run. "engine" is boundary (every
      # self-test, then the boundary check, before any build), hygiene, status,
      # fmt, clippy, test, types, workflows, wasm-check; --setup first installs the pinned
      # actionlint the workflows step needs, checksummed, with the same code
      # contributors use.
      - run: scripts/check.sh --setup engine
      # A PR's own commits and its description carry no agent attribution
      # (AGENTS.md, Commits and PRs). It runs in this job so a failure blocks the
      # merge gate. The body is read from the API when the step runs, not from
      # the event: the event keeps the body as it was when the PR opened, so a
      # footer removed after opening would fail every re-run.
      - name: attribution
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          PR_BODY=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""')
          export PR_BODY
          scripts/check-attribution.sh "$BASE_SHA" "$HEAD_SHA"

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny calls cargo metadata, so it needs the pinned toolchain too.
      - run: rustup toolchain install
      # The same cargo-deny version contributors run locally, as a checksummed release
      # binary, rather than whatever a Docker action bundles.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      # check.sh runs cargo deny --locked: a stale Cargo.lock must fail, not be
      # regenerated and checked instead.
      - run: scripts/check.sh deny
