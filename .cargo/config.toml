# `cargo test --target wasm32-unknown-unknown` runs tests through
# wasm-bindgen-test (crates/AGENTS.md: every engine crate builds for wasm32).
[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"

# ts-rs's export tests run with every `cargo test`; keep their output out of the
# tree. scripts/gen-ts-types.sh sets its own directory, which overrides this.
[env]
TS_RS_EXPORT_DIR = { value = "target/ts-rs", relative = true }
