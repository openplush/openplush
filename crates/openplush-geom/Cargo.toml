[package]
name = "openplush-geom"
description = "f64 vectors, robust predicates, and the epsilon policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
robust = "1.2.0"
thiserror = "2.0.21"

[dev-dependencies]
libm = "0.2.16"

# Native only: proptest pulls in getrandom, which does not build for
# wasm32-unknown-unknown without a JS backend, so tests/predicates.rs (which uses
# it) runs natively only. tests/wasm_predicates.rs runs the predicates on wasm32
# on fixed inputs with analytically known signs.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
num-rational = { version = "0.4.2", default-features = false, features = ["num-bigint-std"] }
num-bigint = "0.4.6"
num-traits = "0.2.19"

[lints]
workspace = true

# Only the wasm32 test build needs the harness; native tests use plain #[test].
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
