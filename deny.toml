# Constitution IX: the license allowlist, exactly. Anything not listed is denied,
# which covers GPL, AGPL, and LGPL. Adding a license here needs an ADR.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
confidence-threshold = 0.93
# The list is the constitution's, not the current dependency set, so entries
# nothing uses yet are expected.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are publish = false; they are checked via `license` in Cargo.toml.
ignore = false

[bans]
# Constitution I names "cargo deny bans" as part of the boundary's enforcement.
# rayon: crates/AGENTS.md forbids threads on the engine path, and rayon builds
# for wasm32 without complaint, so neither the compiler nor the wasm CI job would
# catch it. scripts/check-boundary.sh bans it for crates/ too; this covers the
# whole graph. wasm-bindgen/web-sys/js-sys are not listed: the wasm binding and
# wasm-bindgen-test legitimately need them; the boundary check scopes those.
deny = [
    { crate = "rayon", reason = "crates/AGENTS.md: no threads on the engine/WASM path" },
    { crate = "rayon-core", reason = "crates/AGENTS.md: no threads on the engine/WASM path" },
]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
ignore = [
  # paste is unmaintained with no safe upgrade. It is a proc-macro under faer's gemm and pulp,
  # so it runs at build time and ships no code in the engine or the wasm module.
  # Remove this when gemm and pulp stop depending on it.
  { id = "RUSTSEC-2024-0436", reason = "build-time proc-macro only; no safe upgrade upstream" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
