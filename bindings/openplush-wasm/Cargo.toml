[package]
name = "openplush-wasm"
description = "wasm-bindgen facade over openplush-pipeline, hosted in the web worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openplush-pipeline = { path = "../../crates/openplush-pipeline" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
wasm-bindgen = "0.2.129"

[dev-dependencies]
serde_json = "1.0.154"

[lints]
workspace = true
