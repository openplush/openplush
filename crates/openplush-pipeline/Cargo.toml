[package]
name = "openplush-pipeline"
description = "The only public engine API: staged and memoized"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
openplush-export = { path = "../openplush-export" }
openplush-flatten = { path = "../openplush-flatten" }
openplush-geom = { path = "../openplush-geom" }
openplush-io = { path = "../openplush-io" }
openplush-layout = { path = "../openplush-layout" }
openplush-mesh = { path = "../openplush-mesh" }
openplush-pattern = { path = "../openplush-pattern" }
openplush-seams = { path = "../openplush-seams" }
thiserror = "2.0.21"

[dev-dependencies]
libm = "0.2.16"
openplush-testkit = { path = "../openplush-testkit" }

# Native only: proptest pulls in getrandom, which does not build for
# wasm32-unknown-unknown without a JS backend.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
