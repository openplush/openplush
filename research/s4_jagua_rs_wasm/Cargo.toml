# Non-shipping spike. The empty [workspace] table keeps it out of the root
# workspace (members = ["crates/*"]) and gives it its own Cargo.lock.
[workspace]

[package]
name = "s4-jagua-rs-wasm"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Exact pin: the findings are about this version. No features: `spp` and `bpp`
# stay off, because the harness uses only the core (layout + collision detection).
jagua-rs = { version = "=1.1.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# Same versions as the root Cargo.lock, so the installed test runner matches.
wasm-bindgen = "=0.2.129"
wasm-bindgen-test = "=0.3.79"
