# openplush-testkit is a dev-dependency only (scripts/check-boundary.sh enforces
# that), and loading fixture files is its job, so it does not take the filesystem
# bans in crates/clippy.toml. Clippy reads only the nearest clippy.toml, so the
# root rules are repeated here; scripts/tests/clippy-boundary.test.sh checks them.

disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is not deterministic; use BTreeMap or an index-ordered Vec" },
    { path = "std::collections::HashSet", reason = "iteration order is not deterministic; use BTreeSet or an index-ordered Vec" },
]

disallowed-methods = [
    { path = "slice::sort_unstable", reason = "equal elements end in an unspecified order; use sort, with a total order" },
    { path = "slice::sort_unstable_by", reason = "equal elements end in an unspecified order; use sort_by, with a total order" },
    { path = "slice::sort_unstable_by_key", reason = "equal elements end in an unspecified order; use sort_by_key" },
    { path = "slice::select_nth_unstable", reason = "equal elements end in an unspecified order; sort stably, then index" },
    { path = "slice::select_nth_unstable_by", reason = "equal elements end in an unspecified order; sort stably, then index" },
    { path = "slice::select_nth_unstable_by_key", reason = "equal elements end in an unspecified order; sort stably, then index" },
    { path = "f64::sin", reason = "std defers to the platform libm, which differs between native and wasm32; call libm" },
    { path = "f64::cos", reason = "std defers to the platform libm, which differs between native and wasm32; call libm" },
